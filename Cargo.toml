[package]
name = "swarmcrawl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "A Redis-coordinated distributed crawler"
publish = false

[[bin]]
name = "swarmcrawl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
encoding_rs = "0.8.42"
getrandom = "0.4.3"
html5ever = "0.39.0"
mime = "0.3.17"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
rpassword = "7.5.4"
rustix = { version = "1.1.5", features = ["process"] }
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
flate2 = "1.1.10"
