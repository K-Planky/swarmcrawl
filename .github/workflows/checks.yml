name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit and CLI tests
        run: cargo test --locked
      - name: Locked build
        run: cargo build --locked
      - name: Demo fixture controls
        run: python3 -B -m unittest discover -s demo -p 'test_*.py'
      - name: CLI-managed authenticated setup and lifecycle
        run: cargo test --locked --test cluster_setup -- --ignored --test-threads=1
      - name: Real Docker Redis and distributed process checks
        run: bash scripts/redis-smoke.sh
